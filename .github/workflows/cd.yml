name: CD - Sprint 6 API Docker

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Validate required model artifact
        run: |
          if [ ! -f models/final_model.pkl ]; then
            echo "models/final_model.pkl no existe. Materializar con dvc pull antes de activar CD real."
            echo "Para demo académica, se puede hacer build local y adjuntar evidencia."
            exit 1
          fi

      - name: Build and push Docker image
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ECR_URL="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null
          docker build -t "$ECR_REPOSITORY:$IMAGE_TAG" -f api/Dockerfile .
          docker tag "$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_URL:$IMAGE_TAG"
          docker tag "$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_URL:latest"
          docker push "$ECR_URL:$IMAGE_TAG"
          docker push "$ECR_URL:latest"

      - name: Print next deployment step
        run: |
          echo "Imagen subida a ECR. Desplegar en EC2/ECS/Lambda y configurar API_URL/API_KEY en dashboard."
